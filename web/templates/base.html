<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Social Crawler</title>
  <meta name="description" content="Control center for the social event crawler">
  <!-- Use the project image for browser tabs and saved shortcuts. -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', path='/icons/icon-192.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', path='/site.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body{% if wide %} class="wide-page"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <img class="brand-mark" src="{{ url_for('static', path='/icons/icon-192.png') }}" width="34" height="34" alt="">
        <span><strong>Social Crawler</strong><small>Control center</small></span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Overview</a>
        <a href="/runs" {% if request.url.path.startswith('/runs') %}aria-current="page"{% endif %}>Runs</a>
        <a href="{{ events_nav_url|default('/events') }}" {% if request.url.path.startswith('/events') %}aria-current="page"{% endif %}>Events</a>
        <a href="{{ calendar_nav_url|default('/calendar') }}" {% if request.url.path == '/calendar' %}aria-current="page"{% endif %}>Calendar</a>
        <a href="/sources" {% if request.url.path.startswith('/sources') %}aria-current="page"{% endif %}>Sources</a>
      </nav>
      <div class="nav-label">Instructions</div>
      <nav aria-label="Instruction navigation">
        <a href="/settings/event-ranking-criteria" {% if request.url.path == '/settings/event-ranking-criteria' %}aria-current="page"{% endif %}>Event ranking criteria</a>
        <a href="/settings/workflow" {% if request.url.path == '/settings/workflow' %}aria-current="page"{% endif %}>Crawler skill</a>
      </nav>
      <div class="sidebar-foot">
        Local control center<br>
        Local event store
      </div>
    </aside>
    <main id="main" class="main{% if wide %} main-wide{% endif %}">
      {% if saved %}
        <div class="toast" role="status">Changes saved</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', path='/app.js') }}?v={{ static_asset_versions['app.js'] }}" defer></script>
</body>
</html>
